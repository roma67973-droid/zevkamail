name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API worker — types & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cloudflare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/cloudflare/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm run test:unit

  web:
    name: Website — types, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build for Cloudflare Workers
        run: npm run build:cloudflare
